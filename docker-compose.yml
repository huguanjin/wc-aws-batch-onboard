# 用法：
#   1. docker login ghcr.io -u huguanjin   （包是私有的，需要带 read:packages 权限的 PAT）
#   2. docker compose pull && docker compose up -d
#   3. 浏览器打开 http://127.0.0.1:8787

services:
  aws-batch-onboard:
    image: ghcr.io/huguanjin/wc-aws-batch-onboard:latest

    # 本地改代码后想直接构建，注释掉上面的 image，启用下面这行：
    # build: ./aws-batch-onboard

    container_name: aws-batch-onboard
    restart: unless-stopped

    # 对外暴露。该服务持有 New API 管理员令牌且自身无鉴权，
    # 公网可达前请务必在前面加反向代理 + 访问控制（见文件顶部说明）。
    ports:
      - "8787:8787"

    environment:
      HOST: 0.0.0.0
      PORT: "8787"

    # 用项目自带的 /api/health 做存活检查
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    # 无状态服务，加一层限制，降低被拿下后的影响面
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
